# Сборка и проверка релизного архива на каждый PR и на push в master.
# Тестов в репозитории нет: узлам нужен живой клиент Pilot.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Release-сборка решения и второй проход, который создаёт DynamoPilot.App.zip (см. build/Build-Release.ps1)
      - name: Сборка
        shell: pwsh
        run: ./build/Build-Release.ps1

      - name: Проверка архива
        shell: pwsh
        run: ./build/Test-ReleaseArchive.ps1 -Path src/DynamoPilot.App/bin/Release/net481/DynamoPilot.App.zip
